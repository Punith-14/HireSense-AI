services:
  - type: web
    name: hiresenseai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate
    startCommand: gunicorn backend.wsgi:application --chdir backend
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: hiresense_ai
      - key: LLM_PROVIDER
        value: auto
      - key: XAI_MODEL
        value: grok-2-latest
      - key: XAI_API_KEY
        sync: false
      - key: HF_LOCAL_ENABLED
        value: "False"
      - key: ALLOW_ONLINE_SPEECH_RECOGNITION
        value: "False"
      - key: ONLINE_SPEECH_ENDPOINT
        sync: false
